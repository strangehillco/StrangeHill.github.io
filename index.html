<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StrangeTeam</title>
  <link rel="icon" type="image/png" href="StrangeHill.png" sizes="32x32">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  
  <!-- Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0b0a0a;
      min-height: 100vh;
      font-family: 'Rajdhani', sans-serif;
      color: #e0dcdc;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
      background-image: url('bg.png');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      position: relative;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      z-index: 0;
    }
    .container {
      position: relative;
      z-index: 1;
      width: 1440px;
      max-width: 100%;
      height: 92vh;
      max-height: 950px;
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 0;
      background: rgba(10, 8, 8, 0.92);
      border: 2px solid #b3001b;
      box-shadow: 0 0 40px rgba(200, 0, 0, 0.3), inset 0 0 30px rgba(180, 0, 0, 0.15);
      backdrop-filter: blur(2px);
      overflow: hidden;
      transition: border-color 0.4s, box-shadow 0.4s;
    }
    .sidebar {
      background: rgba(0, 0, 0, 0.85);
      border-right: 2px solid #b3001b;
      padding: 18px 10px 20px 18px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: #b3001b #1f1a1a;
    }
    .sidebar::-webkit-scrollbar { width: 5px; }
    .sidebar::-webkit-scrollbar-track { background: #1f1a1a; }
    .sidebar::-webkit-scrollbar-thumb { background: #b3001b; border-radius: 8px; }

    .hierarchy-title {
      font-family: 'Orbitron', monospace;
      font-weight: 900;
      font-size: 20px;
      letter-spacing: 2px;
      color: #e60000;
      text-shadow: 0 0 12px #ff000088;
      border-bottom: 1px solid #b3001b;
      padding-bottom: 12px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .hierarchy-title .logo {
      width: 36px;
      height: 36px;
      object-fit: contain;
      filter: drop-shadow(0 0 10px #b3001b60);
      flex-shrink: 0;
    }
    .hierarchy-title .title-text {
      display: flex;
      flex-direction: column;
      line-height: 1.1;
    }
    .hierarchy-title .title-text .main {
      font-size: 20px;
      letter-spacing: 2px;
    }
    .hierarchy-title .title-text .sub {
      font-size: 10px;
      letter-spacing: 4px;
      color: #b3001b;
      opacity: 0.6;
      font-weight: 400;
    }

    .tree ul {
      list-style: none;
      padding-left: 8px;
      margin: 0;
    }
    .tree li {
      margin: 6px 0;
      line-height: 1.5;
      position: relative;
      cursor: pointer;
      font-weight: 600;
      letter-spacing: 0.2px;
    }
    .tree li::before {
      content: '▸';
      color: #b3001b;
      margin-right: 8px;
      font-size: 14px;
      display: inline-block;
      transition: transform 0.2s;
    }
    .tree li.expanded::before { transform: rotate(90deg); }
    .tree li .node-label {
      display: inline-block;
      padding: 2px 8px 2px 0;
      border-radius: 4px;
      transition: background 0.2s, color 0.2s;
      font-weight: 700;
      font-size: 15px;
      color: #d4cdcd;
    }
    .tree li .node-label i { margin-right: 10px; width: 20px; color: #b3001b; }
    .tree li .node-label:hover {
      background: #b3001b30;
      color: #fff;
      text-shadow: 0 0 10px #ff4d4d;
    }
    .tree li ul {
      display: none;
      padding-left: 24px;
      border-left: 1px dashed #b3001b55;
      margin-top: 2px;
    }
    .tree li.expanded > ul { display: block; }
    .tree .team-label {
      font-family: 'Orbitron', monospace;
      font-size: 16px;
      letter-spacing: 1px;
    }
    .tree li.member-no-projects::before {
      content: '•';
      color: #b3001b80;
      font-size: 18px;
    }
    .tree li.member-no-projects ul {
      display: none !important;
    }
    .tree li.member-no-projects.expanded::before {
      transform: none;
    }
    .tree li.project-li::before {
      content: '●';
      color: #b3001b60;
      font-size: 14px;
      margin-right: 8px;
      display: inline-block;
      transition: all 0.3s;
    }
    .tree li.project-li.active::before {
      color: #ff0044;
      text-shadow: 0 0 20px #ff0044, 0 0 40px #ff0044;
      animation: pulseDot 1.5s ease-in-out infinite;
    }
    .tree li.project-li.expanded::before {
      transform: none;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    .story-item {
      margin: 10px 0 16px 0;
      padding: 10px 14px;
      background: rgba(179, 0, 27, 0.15);
      border: 1px solid #b3001b60;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .story-item:hover {
      background: rgba(179, 0, 27, 0.3);
      border-color: #b3001b;
      box-shadow: 0 0 20px #b3001b30;
    }
    .story-item .story-icon {
      font-size: 24px;
      color: #b3001b;
      width: 36px;
      text-align: center;
    }
    .story-item .story-info {
      flex: 1;
    }
    .story-item .story-info .story-title {
      font-family: 'Orbitron', monospace;
      font-size: 16px;
      color: #b3001b;
      letter-spacing: 1px;
    }
    .story-item .story-info .story-sub {
      font-size: 12px;
      color: #888;
      letter-spacing: 1px;
      opacity: 0.7;
    }
    .story-item .story-arrow {
      color: #b3001b;
      font-size: 18px;
      opacity: 0.6;
      transition: 0.3s;
    }
    .story-item:hover .story-arrow {
      opacity: 1;
      transform: translateX(4px);
    }

    .content {
      flex: 1;
      display: grid;
      grid-template-columns: 2fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 0;
      background: rgba(0, 0, 0, 0.5);
      padding: 0;
      overflow: hidden;
      transition: all 0.4s;
    }
    .content.story-mode {
      grid-template-columns: 2fr 1fr;
      grid-template-rows: 1fr;
    }
    .content.story-mode .content-left {
      grid-column: 1 / 2;
      grid-row: 1 / 2;
      border-right: 1px solid #b3001b60;
    }
    .content.story-mode .content-right-top {
      grid-column: 2 / 3;
      grid-row: 1 / 2;
      border-bottom: none;
      border-left: 1px solid #b3001b60;
      padding: 0;
      background: radial-gradient(ellipse at center, #1a0a0a 0%, #0a0505 100%);
    }
    .content.story-mode .content-right-bottom {
      display: none;
    }
    .content.story-mode .model-switch {
      display: none;
    }
    .content.story-mode .model-view {
      border: none;
      background: transparent;
      min-height: 100%;
      height: 100%;
      border-radius: 0;
    }
    .content.project-mode {
      grid-template-columns: 2fr 1fr;
      grid-template-rows: 1fr 1fr;
    }
    .content.project-mode .content-left {
      grid-column: 1 / 2;
      grid-row: 1 / 3;
      border-right: 1px solid #b3001b60;
      overflow-y: auto;
    }
    .content.project-mode .content-right-top {
      grid-column: 2 / 3;
      grid-row: 1 / 2;
      border-bottom: 1px solid #b3001b60;
      border-left: 1px solid #b3001b60;
      padding: 16px;
      background: rgba(0, 0, 0, 0.25);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .content.project-mode .content-right-bottom {
      grid-column: 2 / 3;
      grid-row: 2 / 3;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      padding: 16px 18px;
      background: rgba(0, 0, 0, 0.35);
      overflow-y: auto;
      border-left: 1px solid #b3001b60;
    }
    .content.project-mode .model-switch {
      display: none;
    }
    .content.project-mode .model-view {
      border: none;
      background: transparent;
      min-height: 100%;
      height: 100%;
      border-radius: 0;
      width: 100%;
      position: relative;
    }

    .content-left {
      grid-column: 1 / 2;
      grid-row: 1 / 3;
      padding: 24px 28px 20px 28px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      border-right: 1px solid #b3001b60;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.3);
    }
    .content-right-top {
      grid-column: 2 / 3;
      grid-row: 1 / 2;
      padding: 18px 18px 10px 18px;
      border-bottom: 1px solid #b3001b60;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.25);
      position: relative;
      overflow: hidden;
    }
    .content-right-bottom {
      grid-column: 2 / 3;
      grid-row: 2 / 3;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: rgba(0, 0, 0, 0.35);
      overflow-y: auto;
    }
    .lore-section {
      flex: 1 1 auto;
      margin-bottom: 10px;
      overflow-y: auto;
      max-height: 65%;
      position: relative;
    }
    .lore-text {
      font-size: 18px;
      line-height: 1.6;
      font-weight: 400;
      background: rgba(0, 0, 0, 0.4);
      padding: 16px 20px;
      border-radius: 8px;
      border-left: 4px solid #b3001b;
      font-style: italic;
      letter-spacing: 0.3px;
      min-height: 80px;
      position: relative;
    }
    .lore-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(3px);
      z-index: 999 !important;
      pointer-events: none;
      overflow: hidden;
      border-radius: 8px;
      border-left: 4px solid #fffb00;
    }
    .lore-overlay .scanlines {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,0.08) 3px, rgba(0,0,0,0.08) 6px);
      pointer-events: none;
      animation: scanMove 6s linear infinite;
    }
    .lore-overlay .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.6) 100%);
      pointer-events: none;
    }
    .lore-overlay .corner {
      position: absolute;
      width: 20px;
      height: 20px;
      opacity: 0.6;
      z-index: 2;
    }
    .lore-overlay .corner.tl { top: 8px; left: 8px; border-top: 2px solid #fffb00; border-left: 2px solid #fffb00; }
    .lore-overlay .corner.tr { top: 8px; right: 8px; border-top: 2px solid #fffb00; border-right: 2px solid #fffb00; }
    .lore-overlay .corner.bl { bottom: 8px; left: 8px; border-bottom: 2px solid #fffb00; border-left: 2px solid #fffb00; }
    .lore-overlay .corner.br { bottom: 8px; right: 8px; border-bottom: 2px solid #fffb00; border-right: 2px solid #fffb00; }
    .lore-overlay .error-text {
      font-family: 'Orbitron', monospace;
      font-size: 28px !important;
      font-weight: 900;
      letter-spacing: 4px;
      color: #fffb00;
      text-shadow: 0 0 10px #fffb00, 0 0 20px #fffb00, 0 0 40px #fffb00, 0 0 80px #fffb00;
      position: relative;
      z-index: 2;
      animation: glitch 2.5s infinite;
      text-align: center;
      padding: 0 10px;
      word-wrap: break-word;
      max-width: 95%;
    }
    .lore-overlay .error-text .glitch-char {
      display: inline-block;
      animation: glitchChar 1.5s infinite;
    }
    .lore-overlay .error-text .glitch-char:nth-child(1) { animation-delay: 0.0s; }
    .lore-overlay .error-text .glitch-char:nth-child(2) { animation-delay: 0.1s; }
    .lore-overlay .error-text .glitch-char:nth-child(3) { animation-delay: 0.2s; }
    .lore-overlay .error-text .glitch-char:nth-child(4) { animation-delay: 0.3s; }
    .lore-overlay .error-text .glitch-char:nth-child(5) { animation-delay: 0.4s; }
    .lore-overlay .error-text .glitch-char:nth-child(6) { animation-delay: 0.5s; }
    .lore-overlay .error-text .glitch-char:nth-child(7) { animation-delay: 0.6s; }
    .lore-overlay .error-text .glitch-char:nth-child(8) { animation-delay: 0.7s; }
    .lore-overlay .error-text .glitch-char:nth-child(9) { animation-delay: 0.8s; }
    .lore-overlay .error-text .glitch-char:nth-child(10) { animation-delay: 0.9s; }
    .lore-overlay .error-text .glitch-char:nth-child(11) { animation-delay: 0.0s; }
    .lore-overlay .error-text .glitch-char:nth-child(12) { animation-delay: 0.1s; }
    .lore-overlay .error-text .glitch-char:nth-child(13) { animation-delay: 0.2s; }
    .lore-overlay .error-text .glitch-char:nth-child(14) { animation-delay: 0.3s; }
    .lore-overlay .error-text .glitch-char:nth-child(15) { animation-delay: 0.4s; }
    .lore-overlay .error-text .glitch-char:nth-child(16) { animation-delay: 0.5s; }
    .lore-overlay .error-text .glitch-char:nth-child(17) { animation-delay: 0.6s; }
    .lore-overlay .error-text .glitch-char:nth-child(18) { animation-delay: 0.7s; }
    .lore-overlay .error-sub {
      font-family: 'Rajdhani', sans-serif;
      font-size: 12px;
      letter-spacing: 4px;
      color: #eeff0080;
      margin-top: 6px;
      position: relative;
      z-index: 2;
      animation: pulseSub 2s ease-in-out infinite;
      text-align: center;
      padding: 0 10px;
    }
    .lore-overlay .glitch-bar {
      position: absolute;
      height: 2px;
      background: #ff5e00;
      opacity: 0.15;
      z-index: 1;
      animation: barGlitch 3s infinite;
    }
    .lore-overlay .glitch-bar:nth-child(1) { top: 15%; left: -10%; width: 30%; animation-delay: 0.0s; }
    .lore-overlay .glitch-bar:nth-child(2) { top: 30%; right: -10%; width: 25%; animation-delay: 0.5s; }
    .lore-overlay .glitch-bar:nth-child(3) { top: 55%; left: -10%; width: 40%; animation-delay: 1.0s; }
    .lore-overlay .glitch-bar:nth-child(4) { top: 75%; right: -10%; width: 20%; animation-delay: 1.5s; }
    .lore-overlay .glitch-bar:nth-child(5) { top: 90%; left: -10%; width: 35%; animation-delay: 2.0s; }
    .lore-overlay .edge-glow {
      position: absolute;
      inset: -2px;
      border: 1px solid #ff5e0020;
      box-shadow: inset 0 0 40px #ff5e0010, 0 0 40px #ff5e0010;
      pointer-events: none;
      z-index: 2;
      animation: edgePulseImage 2s ease-in-out infinite;
    }
    @keyframes edgePulseImage {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.8; }
    }

    .lore-sub {
      font-size: 11px;
      color: #666;
      opacity: 0.4;
      margin-top: 6px;
      text-align: center;
      font-style: italic;
      letter-spacing: 0.5px;
    }

    .dashed-divider {
      border: none;
      border-top: 2px dashed #b3001b70;
      margin: 10px 0 14px 0;
      width: 80%;
    }
    .social-links {
      display: flex;
      gap: 22px;
      font-size: 28px;
      padding: 6px 0 10px 0;
      flex-wrap: wrap;
    }
    .social-links a {
      color: #ccc;
      transition: 0.25s;
      text-decoration: none;
    }
    .social-links a:hover {
      color: #fff;
      text-shadow: 0 0 24px currentColor;
      transform: scale(1.2);
    }
    .model-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .model-switch {
      display: flex;
      gap: 14px;
      margin-bottom: 8px;
      background: #1a1414cc;
      padding: 4px 18px;
      border-radius: 40px;
      border: 1px solid #b3001b60;
      backdrop-filter: blur(2px);
      z-index: 10;
    }
    .model-switch span {
      cursor: pointer;
      padding: 6px 14px;
      border-radius: 30px;
      font-weight: 600;
      color: #aaa;
      transition: 0.2s;
      font-size: 14px;
      letter-spacing: 0.5px;
    }
    .model-switch span.active {
      background: #b3001b;
      color: #000;
      box-shadow: 0 0 20px #b3001b80;
    }
    .model-switch span:hover { color: #fff; }
    .model-view {
      width: 100%;
      height: 100%;
      min-height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.3);
      border-radius: 16px;
      border: 1px solid #b3001b40;
      overflow: hidden;
      position: relative;
    }
    .model-view canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }
    .model-view img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 12px;
      position: relative;
      z-index: 1;
    }
    .model-placeholder {
      font-size: 48px;
      opacity: 0.4;
      color: #b3001b;
    }
    .loading-bar {
      position: absolute;
      bottom: 10px;
      left: 10%;
      width: 80%;
      height: 4px;
      background: #1f1a1a;
      border-radius: 4px;
      overflow: hidden;
      z-index: 5;
    }
    .loading-bar .progress {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #b3001b, #ff4444);
      border-radius: 4px;
      transition: width 0.3s;
    }
    .dossier {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 10px 4px;
      border-top: 1px solid #b3001b40;
    }
    .dossier-item {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px dashed #b3001b30;
      padding: 6px 0;
      font-size: 16px;
      font-weight: 500;
      gap: 20px;
    }
    .dossier-item .label::after {
      content: ': ';
    }
    .dossier-item .label { 
      color: #b3001b;
      font-weight: 600;
      flex-shrink: 0;
      min-width: 80px;
    }
    .dossier-item .value {
      color: #ddd;
      text-align: right;
      word-break: break-word;
    }
    .section-title {
      font-family: 'Orbitron', monospace;
      font-size: 18px;
      color: #b3001b;
      border-bottom: 1px solid #b3001b40;
      padding-bottom: 4px;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }

    .story-logo-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 20px;
      background: radial-gradient(ellipse at 50% 50%, #1a0808 0%, #0a0303 60%, #050101 100%);
    }
    .story-logo-wrapper .logo-glow {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 50%, #b3001b20, transparent 70%);
      pointer-events: none;
      animation: pulseGlow 4s ease-in-out infinite;
    }
    .story-logo-wrapper .logo-img {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
      filter: drop-shadow(0 0 50px #b3001b60) drop-shadow(0 0 100px #b3001b20);
      position: relative;
      z-index: 2;
      animation: floatLogo 6s ease-in-out infinite;
    }
    .story-logo-wrapper .logo-title {
      font-family: 'Orbitron', monospace;
      font-size: 20px;
      letter-spacing: 8px;
      color: #b3001b;
      opacity: 0.5;
      margin-top: -50px;
      position: relative;
      z-index: 2;
      text-shadow: 0 0 30px #b3001b40;
      text-align: center;
    }
    .story-logo-wrapper .corner {
      position: absolute;
      width: 30px;
      height: 30px;
      opacity: 0.4;
      z-index: 3;
    }
    .story-logo-wrapper .corner.tl { top: 15px; left: 15px; border-top: 2px solid #b3001b; border-left: 2px solid #b3001b; }
    .story-logo-wrapper .corner.tr { top: 15px; right: 15px; border-top: 2px solid #b3001b; border-right: 2px solid #b3001b; }
    .story-logo-wrapper .corner.bl { bottom: 15px; left: 15px; border-bottom: 2px solid #b3001b; border-left: 2px solid #b3001b; }
    .story-logo-wrapper .corner.br { bottom: 15px; right: 15px; border-bottom: 2px solid #b3001b; border-right: 2px solid #b3001b; }

    @keyframes pulseGlow {

    @keyframes glitch {
      0%, 90%, 100% { opacity: 1; transform: translateX(0); }

  // РЕНДЕР ИЕРАРХИИ
  function renderTree() {
    const root = document.getElementById('treeRoot');
    let html = '<ul>';
    for (const [team, membersList] of Object.entries(hierarchy)) {
      html += `<li class="team-li" data-team="${team}">
        <span class="node-label team-label"><i class="fas fa-folder-open"></i>${team}</span>
        <ul>`;
      for (const memberKey of membersList) {
        const m = members[memberKey];
        if (!m) continue;
        const color = m.color || '#b3001b';
        const hasProjects = m.hasProjects || false;
        const projects = m.projects || [];
        
        if (!hasProjects || projects.length === 0) {
          html += `<li class="member-li member-no-projects" data-member="${memberKey}">
            <span class="node-label" style="color: ${color};"><i class="fas fa-user-astronaut"></i>${m.name}</span>
          </li>`;
        } else {
          html += `<li class="member-li" data-member="${memberKey}">
            <span class="node-label" style="color: ${color};"><i class="fas fa-user-astronaut"></i>${m.name}</span>
            <ul class="project-list" data-member="${memberKey}">`;
          for (let p = 0; p < projects.length; p++) {
            const project = projects[p];
            const isActive = project.active === true;
            html += `<li class="project-li ${isActive ? 'active' : ''}" data-member="${memberKey}" data-project="${p}">
              <span class="node-label" style="color: ${color};"><i class="fas fa-cube"></i>${project.title}</span>
            </li>`;
          }
          html += `</ul></li>`;
        }
      }
      html += `</ul></li>`;
    }
    html += '</ul>';
    root.innerHTML = html;

    root.querySelectorAll('.team-li > .node-label').forEach(el => {
      el.addEventListener('click', function(e) {
        e.stopPropagation();
        const li = this.closest('.team-li');
        const teamKey = li.dataset.team;
        showTeam(teamKey);
        li.classList.toggle('expanded');
      });
    });

    root.querySelectorAll('.member-li > .node-label').forEach(el => {

  // ЗАГРУЗКА 3D МОДЕЛИ
  function load3DModel(modelView, modelPath, color, member) {
    clearModelView();
    
    const loadingBar = createLoadingBar();
    modelView.appendChild(loadingBar);
    showLoading();
    
    isModelLoading = true;

    if (!modelPath || modelPath === '') {
      hideLoading();
      isModelLoading = false;
      showFallback(modelView, member);
      return;
    }

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0808);
    currentScene = scene;
    
    const containerWidth = modelView.clientWidth || 300;
    const containerHeight = modelView.clientHeight || 200;
    
    const camera = new THREE.PerspectiveCamera(30, containerWidth / containerHeight, 1.5, 1000);
    camera.position.set(-2, 2, -2);
    camera.lookAt(0, 0.2, 0);

    const renderer = new THREE.WebGLRenderer({ 
      antialias: true,
      alpha: false 
    });
    renderer.setSize(containerWidth, containerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.8;
    
    const canvas = renderer.domElement;
    modelView.appendChild(canvas);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 1.2;
    controls.enableZoom = true;
    controls.target.set(0, 0.2, 0);
    controls.update();

    const mainLight = new THREE.DirectionalLight(0xffffff, 1.4);
    mainLight.position.set(3, 5, 4);
    mainLight.castShadow = true;
    scene.add(mainLight);

    const backLight = new THREE.DirectionalLight(0xffffff, 0.7);
    backLight.position.set(-2, 2, -4);
    scene.add(backLight);

    const leftLight = new THREE.DirectionalLight(0xffffff, 0.6);
    leftLight.position.set(-4, 2, 1);
    scene.add(leftLight);

    const rightLight = new THREE.DirectionalLight(0xffffff, 0.6);
    rightLight.position.set(4, 2, 1);
    scene.add(rightLight);

    const bottomLight = new THREE.DirectionalLight(0xffffff, 0.3);
    bottomLight.position.set(0, -3, 1);
    scene.add(bottomLight);

    const ambientLight = new THREE.AmbientLight(0x555577, 0.7);
    scene.add(ambientLight);

    const pointLight1 = new THREE.PointLight(0xffffff, 0.4, 6);
    pointLight1.position.set(1.5, 2, 2);
    scene.add(pointLight1);

    const pointLight2 = new THREE.PointLight(0xffffff, 0.3, 6);
    pointLight2.position.set(-1.5, 1.5, -2);
    scene.add(pointLight2);

    const frontLight = new THREE.DirectionalLight(0xffffff, 0.5);
    frontLight.position.set(0, 1.5, 4);
    scene.add(frontLight);

    const gridHelper = new THREE.GridHelper(3, 16, 0x661111, 0x331111);
    gridHelper.position.y = -0.8;
    gridHelper.material.transparent = true;
    gridHelper.material.opacity = 0.3;
    scene.add(gridHelper);

    currentRenderer = renderer;
    currentControls = controls;

    const loader = new THREE.GLTFLoader();
    
    loader.load(
      modelPath,
      (gltf) => {
        hideLoading();
        isModelLoading = false;
        
        const model = gltf.scene;
        
        const box = new THREE.Box3().setFromObject(model);
        const size = box.getSize(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z);
        if (maxDim > 2) {
          const scale = 1.8 / maxDim;
          model.scale.set(scale, scale, scale);
        } else {
          model.scale.set(1.2, 1.2, 1.2);
        }
        
        model.position.set(0, -0.8, 0);
        
        model.traverse((node) => {
          if (node.isMesh) {
            node.castShadow = true;
            node.receiveShadow = true;
            if (node.material) {
              node.material.roughness = 0.85;
              node.material.metalness = 0.1;
              node.material.flatShading = false;
              if (node.material.emissive) {
                node.material.emissive.setHex(0x000000);
                node.material.emissiveIntensity = 0;
              }
            }
          }
        });
        
        scene.add(model);
        currentModelGroup = model;
        
        if (member.noModelOverlay === true) {
          setTimeout(() => {
            showNoModelOverlay(modelView, member);
          }, 100);
        }
      },
      (xhr) => {
        if (xhr.total > 0) {
          const percent = (xhr.loaded / xhr.total) * 100;
          const progressBar = document.getElementById('progressBar');
          if (progressBar) progressBar.style.width = percent + '%';
        }
      },
      (error) => {
        console.warn('Ошибка загрузки модели:', error);
        hideLoading();
        isModelLoading = false;
        showFallback(modelView, member);
        if (member.noModelOverlay === true) {
          setTimeout(() => {
            showNoModelOverlay(modelView, member);
          }, 100);
        }
      }
    );

    function animate() {
      animationId = requestAnimationFrame(animate);
      if (controls) controls.update();
      if (renderer && scene && camera) {
        renderer.render(scene, camera);
      }
    }
    animate();

    const resizeObserver = new ResizeObserver(() => {
      if (renderer && modelView) {
        const w = modelView.clientWidth;
        const h = modelView.clientHeight;
        if (w > 0 && h > 0) {
          renderer.setSize(w, h);
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
        }
      }
    });
    resizeObserver.observe(modelView);
  }

  // ФУНКЦИИ ДЛЯ УПРАВЛЕНИЯ ПЛЕЙЛИСТОМ
  window.togglePlaylist = function(playlistId) {
    const container = document.getElementById(playlistId + '_container');
    const icon = document.getElementById(playlistId + '_icon');
    if (container) {
      container.classList.toggle('open');
      if (icon) {
        icon.classList.toggle('open');
      }
    }
  };

  window.playTrack = function(trackId, playlistId) {
    const trackElement = document.getElementById(trackId);
    if (!trackElement) return;
    
    const src = trackElement.dataset.src;
    const title = trackElement.dataset.title;
    const index = parseInt(trackElement.dataset.index);
    
    const playerWrapper = document.getElementById(playlistId + '_player');
    const audio = document.getElementById(playlistId + '_audio');
    
    if (!audio || !playerWrapper) return;
    
    // Обновляем активный трек
    const container = document.getElementById(playlistId + '_container');
    if (container) {
      container.querySelectorAll('.playlist-item').forEach(el => {
        el.classList.remove('active');
        const status = el.querySelector('.track-status');
        if (status) {
          status.innerHTML = '<i class="fas fa-play"></i>';
        }
      });
    }
    trackElement.classList.add('active');
    const statusIcon = trackElement.querySelector('.track-status');
    if (statusIcon) {
      statusIcon.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
    }
    
    // Загружаем аудио
    audio.src = src;
    audio.load();
    
    audio.onloadedmetadata = function() {
      const duration = audio.duration;
      const durationEl = document.getElementById(trackId + '_duration');
      if (durationEl) {
        durationEl.textContent = formatTime(duration);
      }
      if (statusIcon) {
        statusIcon.innerHTML = '<i class="fas fa-pause"></i>';
      }
      playerWrapper.style.display = 'block';
      setupPlaylistPlayer(playlistId, trackId);
      audio.play();
    };
    
    audio.onerror = function() {
      if (statusIcon) {
        statusIcon.innerHTML = '<i class="fas fa-exclamation-triangle" style="color:#b3001b;"></i>';
      }
      console.warn('Не удалось загрузить аудио:', src);
    };
  };

  function formatTime(seconds) {
    if (isNaN(seconds) || !isFinite(seconds)) return '--:--';
    const mins = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60);
    return `${mins}:${secs.toString().padStart(2, '0')}`;
  }

  function setupPlaylistPlayer(playlistId, trackId) {
    const audio = document.getElementById(playlistId + '_audio');
    if (!audio) return;
    
    const playBtn = document.getElementById(playlistId + '_playbtn');
    const timeDisplay = document.getElementById(playlistId + '_time');
    const progress = document.getElementById(playlistId + '_progress');
    const thumb = document.getElementById(playlistId + '_thumb');
    const timeline = document.getElementById(playlistId + '_timeline');
    const volumeBtn = document.getElementById(playlistId + '_volumeBtn');
    const volumePopup = document.getElementById(playlistId + '_volumePopup');
    const volumeFill = document.getElementById(playlistId + '_volumeFill');
    const volumeThumb = document.getElementById(playlistId + '_volumeThumb');
    const volumeValue = document.getElementById(playlistId + '_volumeValue');
    const menuBtn = document.getElementById(playlistId + '_menuBtn');
    const menuDropdown = document.getElementById(playlistId + '_menuDropdown');
    const speedRange = document.getElementById(playlistId + '_speedRange');
    const speedValue = document.getElementById(playlistId + '_speedValue');
    
    let isDragging = false;
    let isDraggingVolume = false;
    let isMuted = false;
    let lastVolume = audio.volume || 1;
    let animationFrameId = null;
    
    function updateProgress() {
      if (!isDragging && audio.duration) {
        const percent = (audio.currentTime / audio.duration) * 100;
        progress.style.width = percent + '%';
        thumb.style.left = percent + '%';
        timeDisplay.textContent = formatTime(audio.currentTime) + ' / ' + formatTime(audio.duration);
      }
    }
    
    function togglePlay() {
      if (audio.paused) {
        audio.play();
        playBtn.innerHTML = `<svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>`;
        // Обновляем статус трека
        const container = document.getElementById(playlistId + '_container');
        if (container) {
          const activeTrack = container.querySelector('.playlist-item.active');
          if (activeTrack) {
            const status = activeTrack.querySelector('.track-status');
            if (status) status.innerHTML = '<i class="fas fa-pause"></i>';
          }
        }
      } else {
        audio.pause();
        playBtn.innerHTML = `<svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>`;
        const container = document.getElementById(playlistId + '_container');
        if (container) {
          const activeTrack = container.querySelector('.playlist-item.active');
          if (activeTrack) {
            const status = activeTrack.querySelector('.track-status');
            if (status) status.innerHTML = '<i class="fas fa-play"></i>';
          }
        }
      }
    }
    
    function setTimelinePosition(clientX) {
      const rect = timeline.getBoundingClientRect();
      let percent = (clientX - rect.left) / rect.width;
      percent = Math.max(0, Math.min(1, percent));
      if (audio.duration) {
        audio.currentTime = percent * audio.duration;
        progress.style.width = percent * 100 + '%';
        thumb.style.left = percent * 100 + '%';
      }
    }
    
    function updateVolumeUI(value) {
      const val = Math.max(0, Math.min(100, value));
      const percent = val / 100;
      audio.volume = percent;
      volumeValue.textContent = Math.round(percent * 100) + '%';
      volumeFill.style.height = val + '%';
      volumeThumb.style.top = (100 - val) + '%';
      
      if (percent === 0) {
        isMuted = true;
        volumeBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>`;
      } else {
        isMuted = false;
        volumeBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>`;
      }
    }
    
    function getVolumeFromEvent(clientY) {
      const rect = document.getElementById(playlistId + '_volumeSlider').getBoundingClientRect();
      const relativeY = clientY - rect.top;
      const percent = 100 - ((relativeY / rect.height) * 100);
      return Math.max(0, Math.min(100, percent));
    }
    
    // Обработчики для кнопки play
    playBtn.addEventListener('click', togglePlay);
    
    // Обработчики для timeline
    timeline.addEventListener('mousedown', (e) => {
      isDragging = true;
      thumb.classList.add('active');
      setTimelinePosition(e.clientX);
    });
    
    document.addEventListener('mousemove', (e) => {
      if (isDragging) {
        setTimelinePosition(e.clientX);
      }
    });
    
    document.addEventListener('mouseup', () => {
      if (isDragging) {
        isDragging = false;
        thumb.classList.remove('active');
      }
    });
    
    timeline.addEventListener('touchstart', (e) => {
      isDragging = true;
      thumb.classList.add('active');
      setTimelinePosition(e.touches[0].clientX);
    });
    
    document.addEventListener('touchmove', (e) => {
      if (isDragging) {
        setTimelinePosition(e.touches[0].clientX);
      }
    });
    
    document.addEventListener('touchend', () => {
      if (isDragging) {
        isDragging = false;
        thumb.classList.remove('active');
      }
    });
    
    // Обновление прогресса
    audio.addEventListener('timeupdate', updateProgress);
    audio.addEventListener('loadedmetadata', updateProgress);
    
    audio.addEventListener('play', () => {
      playBtn.innerHTML = `<svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>`;
    });
    
    audio.addEventListener('pause', () => {
      playBtn.innerHTML = `<svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>`;
    });
    
    audio.addEventListener('ended', () => {
      playBtn.innerHTML = `<svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>`;
      const container = document.getElementById(playlistId + '_container');
      if (container) {
        const activeTrack = container.querySelector('.playlist-item.active');
        if (activeTrack) {
          const status = activeTrack.querySelector('.track-status');
          if (status) status.innerHTML = '<i class="fas fa-play"></i>';
        }
      }
      progress.style.width = '0%';
      thumb.style.left = '0%';
      timeDisplay.textContent = '0:00 / ' + formatTime(audio.duration);
    });
    
    // Обновление времени при загрузке
    if (audio.readyState >= 1) {
      updateProgress();
    }
    
    // Обработчики громкости
    const volumeSlider = document.getElementById(playlistId + '_volumeSlider');
    
    volumeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (isMuted) {
        updateVolumeUI(Math.round(lastVolume * 100));
      } else {
        lastVolume = audio.volume;
        updateVolumeUI(0);
      }
    });
    
    volumeBtn.addEventListener('mouseenter', () => {
      volumePopup.classList.add('visible');
    });
    
    volumeBtn.addEventListener('mouseleave', () => {
      setTimeout(() => {
        if (!isDraggingVolume) {
          volumePopup.classList.remove('visible');
        }
      }, 300);
    });
    
    volumePopup.addEventListener('mouseenter', () => {
      volumePopup.classList.add('visible');
    });
    
    volumePopup.addEventListener('mouseleave', () => {
      if (!isDraggingVolume) {
        volumePopup.classList.remove('visible');
      }
    });
    
    volumeSlider.addEventListener('mousedown', (e) => {
      e.preventDefault();
      e.stopPropagation();
      isDraggingVolume = true;
      const val = getVolumeFromEvent(e.clientY);
      updateVolumeUI(val);
      volumePopup.classList.add('visible');
    });
    
    document.addEventListener('mousemove', (e) => {
      if (isDraggingVolume) {
        e.preventDefault();
        const val = getVolumeFromEvent(e.clientY);
        updateVolumeUI(val);
      }
    });
    
    document.addEventListener('mouseup', () => {
      if (isDraggingVolume) {
        isDraggingVolume = false;
        setTimeout(() => {
          if (!volumePopup.matches(':hover') && !volumeBtn.matches(':hover')) {
            volumePopup.classList.remove('visible');
          }
        }, 300);
      }
    });
    
    volumeSlider.addEventListener('touchstart', (e) => {
      e.preventDefault();
      e.stopPropagation();
      isDraggingVolume = true;
      const touch = e.touches[0];
      const val = getVolumeFromEvent(touch.clientY);
      updateVolumeUI(val);
      volumePopup.classList.add('visible');
    }, { passive: false });
    
    document.addEventListener('touchmove', (e) => {
      if (isDraggingVolume) {
        e.preventDefault();
        const touch = e.touches[0];
        const val = getVolumeFromEvent(touch.clientY);
        updateVolumeUI(val);
      }
    }, { passive: false });
    
    document.addEventListener('touchend', () => {
      if (isDraggingVolume) {
        isDraggingVolume = false;
        setTimeout(() => {
          if (!volumePopup.matches(':hover') && !volumeBtn.matches(':hover')) {
            volumePopup.classList.remove('visible');
          }
        }, 300);
      }
    });
    
    // Меню
    menuBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      menuDropdown.classList.toggle('open');
    });
    
    document.addEventListener('click', (e) => {
      if (!menuBtn.contains(e.target) && !menuDropdown.contains(e.target)) {
        menuDropdown.classList.remove('open');
      }
    });
    
    // Скачивание
    menuDropdown.querySelector('[data-action="download"]').addEventListener('click', () => {
      const src = audio.src;
      if (src) {
        const link = document.createElement('a');
        link.href = src;
        link.download = 'audio';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      }
      menuDropdown.classList.remove('open');
    });
    
    // Скорость
    speedRange.addEventListener('input', () => {
      const val = parseFloat(speedRange.value);
      speedValue.textContent = val.toFixed(1) + '×';
      audio.playbackRate = val;
    });
    
    // Инициализация громкости
    updateVolumeUI(Math.round((audio.volume || 1) * 100));
  }

  function extractVideoId(url) {
    if (!url) return null;
    const match = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([^&\n?#]+)/);
    return match ? match[1] : null;
  }

  // ОБРАБОТКА ПРЯМЫХ ССЫЛОК (ХЭШЕЙ)
  function handleHash() {
    const hash = window.location.hash;
    
    if (!hash || hash === '#') {
      showStory();
      return;
    }
    
    const parts = hash.substring(1).split('-');
    const type = parts[0];
    
    if (type === 'member') {
      const memberKey = parts.slice(1).join('-');
      if (members[memberKey]) {
        showMember(memberKey);
        setTimeout(() => {
          const memberLi = document.querySelector(`.member-li[data-member="${memberKey}"]`);
          if (memberLi) {
            const teamLi = memberLi.closest('.team-li');
            if (teamLi) teamLi.classList.add('expanded');
            memberLi.classList.add('expanded');
            memberLi.scrollIntoView({ block: 'center', behavior: 'smooth' });
          }
        }, 100);
      } else {
        showStory();
      }
    } else if (type === 'project') {
      const memberKey = parts[1];
      const projectTitle = parts.slice(2).join('-').replace(/-/g, ' ');
      
      if (members[memberKey] && members[memberKey].projects) {
        const projectIndex = members[memberKey].projects.findIndex(
          p => p.title.toLowerCase() === projectTitle.toLowerCase()
        );
        
        if (projectIndex !== -1) {
          showProject(memberKey, projectIndex);
          setTimeout(() => {
            const projectLi = document.querySelector(
              `.project-li[data-member="${memberKey}"][data-project="${projectIndex}"]`
            );
            if (projectLi) {
              const memberLi = projectLi.closest('.member-li');
              if (memberLi) {
                const teamLi = memberLi.closest('.team-li');
                if (teamLi) teamLi.classList.add('expanded');
                memberLi.classList.add('expanded');
              }
              projectLi.classList.add('expanded');
              projectLi.scrollIntoView({ block: 'center', behavior: 'smooth' });
            }
          }, 100);
        } else {
          showStory();
        }
      } else {
        showStory();
      }
    } else if (type === 'team') {
      const teamKey = parts.slice(1).join('-');
      if (teamData[teamKey]) {
        showTeam(teamKey);
        setTimeout(() => {
          const teamLi = document.querySelector(`.team-li[data-team="${teamKey}"]`);
          if (teamLi) {
            teamLi.classList.add('expanded');
            teamLi.scrollIntoView({ block: 'center', behavior: 'smooth' });
          }
        }, 100);
      } else {
        showStory();
      }
    } else if (type === 'story') {
      showStory();
    } else {
      showStory();
    }
  }

  window.addEventListener('hashchange', function() {
    handleHash();
  });

  // Инициализация
  document.getElementById('storyButton').addEventListener('click', function() {
    showStory();
  });

  renderTree();

  setTimeout(function() {
    handleHash();
  }, 50);
  
  // ФУНКЦИИ ДЛЯ МОДАЛЬНОГО ОКНА ГАЛЕРЕИ
  let currentGalleryImages = [];
  let currentGalleryIndex = 0;
  let isZoomed = false;

  function openScreenshotModal(images, index) {
    if (!images || images.length === 0) return;
    currentGalleryImages = images;
    currentGalleryIndex = Math.min(index, images.length - 1);
    isZoomed = false;
    
    const modal = document.getElementById('screenshotModal');
    const img = document.getElementById('modalImage');
    const counter = document.getElementById('modalCounter');
    
    img.src = images[currentGalleryIndex];
    img.classList.remove('zoomed');
    counter.textContent = `${currentGalleryIndex + 1} / ${images.length}`;
    
    document.getElementById('modalPrevBtn').style.display = images.length > 1 ? 'flex' : 'none';
    document.getElementById('modalNextBtn').style.display = images.length > 1 ? 'flex' : 'none';
    
    modal.classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  function closeScreenshotModal() {
    document.getElementById('screenshotModal').classList.remove('active');
    document.body.style.overflow = '';
    isZoomed = false;
  }

  function navigateGallery(direction) {
    const newIndex = currentGalleryIndex + direction;
    if (newIndex < 0 || newIndex >= currentGalleryImages.length) return;
    
    currentGalleryIndex = newIndex;
    const img = document.getElementById('modalImage');
    img.src = currentGalleryImages[currentGalleryIndex];
    img.classList.remove('zoomed');
    isZoomed = false;
    document.getElementById('modalCounter').textContent = `${currentGalleryIndex + 1} / ${currentGalleryImages.length}`;
  }

  document.getElementById('modalCloseBtn').addEventListener('click', closeScreenshotModal);
  document.getElementById('modalPrevBtn').addEventListener('click', function(e) {
    e.stopPropagation();
    navigateGallery(-1);
  });
  document.getElementById('modalNextBtn').addEventListener('click', function(e) {
    e.stopPropagation();
    navigateGallery(1);
  });
  
  document.getElementById('modalImage').addEventListener('click', function(e) {
    e.stopPropagation();
    isZoomed = !isZoomed;
    this.classList.toggle('zoomed');
  });
  
  document.getElementById('screenshotModal').addEventListener('click', function(e) {
    if (e.target === this) closeScreenshotModal();
  });
  
  document.addEventListener('keydown', function(e) {
    if (!document.getElementById('screenshotModal').classList.contains('active')) return;
    if (e.key === 'Escape') closeScreenshotModal();
    if (e.key === 'ArrowLeft') navigateGallery(-1);
    if (e.key === 'ArrowRight') navigateGallery(1);
    if (e.key === '+' || e.key === '=') {
      e.preventDefault();
      const img = document.getElementById('modalImage');
      isZoomed = !isZoomed;
      img.classList.toggle('zoomed');
    }
  });

  // ПЕРЕХВАТ КЛИКОВ ПО ПРОЕКТАМ В ДЕРЕВЕ
  document.addEventListener('click', function(e) {
    const projectLabel = e.target.closest('.project-li > .node-label');
    if (projectLabel) {
      const li = projectLabel.closest('.project-li');
      if (li) {
        const memberKey = li.dataset.member;
        const projectIndex = parseInt(li.dataset.project);
        if (memberKey && !isNaN(projectIndex)) {
          setTimeout(function() {
            showProject(memberKey, projectIndex);
          }, 50);
        }
      }
    }
  });

})();
